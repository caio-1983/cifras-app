# Bloco de server do site de cifras. Só este subdomínio.
#
# NÃO sobrescreve nada do que já roda na VPS: é um arquivo próprio em
# sites-available, sem `default_server`, sem mexer em nginx.conf.
#
#   sudo cp deploy/nginx-cifras.conf /etc/nginx/sites-available/cifras
#   sudo ln -s /etc/nginx/sites-available/cifras /etc/nginx/sites-enabled/cifras
#   sudo nginx -t && sudo systemctl reload nginx
#
# Este arquivo é a versão HTTP. O certbot acrescenta o TLS nele (ver
# deploy/README.md) — rode o certbot DEPOIS de habilitar e recarregar.

server {
    listen 80;
    listen [::]:80;
    server_name cifras.integrasolutions.com.br;

    # O acervo tem letra de música protegida e isto é ferramenta interna da
    # banda. Todo o site fica atrás de senha; ver README.md para criar o
    # arquivo. Arquivo próprio, para não colidir com o de outros sites.
    auth_basic "Cifras";
    auth_basic_user_file /etc/nginx/.htpasswd-cifras;

    # Não indexar, mesmo que alguém chegue com a senha.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/cifras.access.log;
    error_log  /var/log/nginx/cifras.error.log;

    # Cifra é texto: comprime bem e a VPS agradece.
    gzip on;
    gzip_types text/html text/plain text/css application/json;
    gzip_min_length 1024;

    # O healthcheck fica FORA do basic auth: o monitoramento não deve precisar
    # da senha da banda, e um 401 esconderia uma queda de verdade.
    location = /saude {
        auth_basic off;
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;   # igual a CIFRAS_PORTA no .env
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
